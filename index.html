<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KamasUltra</title>
<style>
  :root {
    --bg: #141414;
    --panel: #1e1e1e;
    --field: #2d2d2d;
    --border: #333;
    --text: #f2f2f2;
    --muted: #9a9a9a;
    --accent: #4a90c2;
    --good: #5ec27a;
    --bad: #e06666;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.4;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 16px;
    padding: 10px 16px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }
  .brand { font-weight: 700; font-size: 17px; white-space: nowrap; }
  nav { display: flex; gap: 4px; overflow-x: auto; flex: 1; scrollbar-width: none; }
  nav::-webkit-scrollbar { display: none; }
  nav button {
    background: none; border: 0; color: var(--muted);
    padding: 8px 12px; border-radius: 8px;
    font: inherit; font-size: 14px; cursor: pointer; white-space: nowrap;
  }
  nav button:hover { color: var(--text); }
  nav button.active { background: var(--field); color: var(--text); }
  main { max-width: 820px; margin: 0 auto; padding: 20px 16px 60px; }
  section { display: none; }
  section.active { display: block; }
  h2 { font-size: 20px; margin: 0 0 16px; }
  label.field { display: block; margin-bottom: 18px; }
  label.field > span { display: block; font-weight: 600; margin-bottom: 6px; }
  .input-wrap {
    display: flex; align-items: center;
    background: var(--field); border-radius: 8px; padding: 0 12px;
  }
  .input-wrap input {
    flex: 1; min-width: 0; background: none; border: 0; outline: 0;
    color: var(--text); font: inherit; padding: 12px 0;
  }
  .input-wrap .unit { color: var(--muted); }
  .input-wrap:focus-within { outline: 2px solid var(--accent); }
  .opt { margin: 4px 0 20px; font-size: 14px; color: var(--muted); }
  .opt select {
    background: var(--field); color: var(--text); border: 0;
    border-radius: 6px; padding: 6px 8px; font: inherit; margin-left: 6px;
  }
  hr { border: 0; border-top: 1px solid var(--border); margin: 8px 0 18px; }
  .section-title {
    font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
    color: var(--accent); font-weight: 700; margin-bottom: 10px;
  }
  .result {
    display: flex; flex-wrap: wrap; gap: 14px; align-items: stretch;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; padding: 18px;
  }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 18px; min-width: 140px;
  }
  .result .card { background: #232323; }
  .card .k { font-size: 13px; color: var(--muted); margin-bottom: 2px; }
  .card .v { font-size: 26px; font-weight: 700; }
  .pos { color: var(--good); }
  .neg { color: var(--bad); }
  details { margin-top: 18px; color: var(--muted); font-size: 14px; }
  details summary { cursor: pointer; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; }
  .soon {
    background: var(--panel); border: 1px dashed var(--border);
    border-radius: 12px; padding: 28px; text-align: center; color: var(--muted);
  }
  .more-list { display: grid; gap: 10px; }
  .more-list a {
    display: block; background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 16px; color: var(--text); text-decoration: none;
  }
  .more-list a:hover { border-color: var(--accent); }
</style>
</head>
<body>

<header>
  <div class="brand">KamasUltra</div>
  <nav id="nav">
    <button data-tab="dashboard">Dashboard 🚀</button>
    <button data-tab="investissements">Investissements 🟤</button>
    <button data-tab="calculateurs" class="active">Calculateurs 🧮</button>
    <button data-tab="hdv">Hôtel de vente 🏷️</button>
    <button data-tab="plus">Plus ▾</button>
  </nav>
</header>

<main>

  <section id="dashboard">
    <h2>Dashboard</h2>
    <div class="soon">À venir : le suivi de tes bénéfices enregistrés.</div>
  </section>

  <section id="investissements">
    <h2>Investissements</h2>
    <div class="soon">À venir.</div>
  </section>

  <section id="calculateurs" class="active">
    <h2>Calculateurs</h2>

    <label class="field">
      <span>Prix de base</span>
      <div class="input-wrap">
        <input id="base" type="number" inputmode="decimal" min="0" step="any" value="500">
        <span class="unit">K</span>
      </div>
    </label>

    <label class="field">
      <span>Prix PA</span>
      <div class="input-wrap">
        <input id="pa" type="number" inputmode="decimal" min="0" step="any" value="1505">
        <span class="unit">K</span>
      </div>
    </label>

    <label class="field">
      <span>Prix RA</span>
      <div class="input-wrap">
        <input id="ra" type="number" inputmode="decimal" min="0" step="any" value="2500">
        <span class="unit">K</span>
      </div>
    </label>

    <div class="opt">
      Coût de la rune RA calculé à partir du
      <select id="raMode">
        <option value="base">prix de base (9 runes)</option>
        <option value="pa">prix PA (3 runes PA)</option>
      </select>
    </div>

    <hr>

    <div class="section-title">Rune la plus rentable</div>
    <div class="result">
      <div class="card"><div class="v" id="winner">–</div></div>
      <div class="card">
        <div class="k">Bénef net</div>
        <div class="v" id="winnerNet">–</div>
      </div>
    </div>

    <details>
      <summary>Voir le détail du calcul</summary>
      <table>
        <thead><tr><th>Rune</th><th>Coût</th><th>Vente après taxe (2 %)</th><th>Bénef net</th></tr></thead>
        <tbody id="detail"></tbody>
      </table>
    </details>
  </section>

  <section id="hdv">
    <h2>Hôtel de vente</h2>
    <div class="soon">À venir.</div>
  </section>

  <section id="plus">
    <h2>Plus</h2>
    <div class="more-list" id="links">
      <!-- Liens utiles : à compléter -->
      <a href="#" target="_blank" rel="noopener">Lien utile 1</a>
    </div>
  </section>

</main>

<script>
  var TAX = 0.02; // taxe de mise en vente

  // ---------- Onglets ----------
  var buttons = document.querySelectorAll('#nav button');
  function showTab(name) {
    document.querySelectorAll('section').forEach(function (s) {
      s.classList.toggle('active', s.id === name);
    });
    buttons.forEach(function (b) {
      b.classList.toggle('active', b.dataset.tab === name);
    });
    try { localStorage.setItem('ku_tab', name); } catch (e) {}
  }
  buttons.forEach(function (b) {
    b.addEventListener('click', function () { showTab(b.dataset.tab); });
  });

  // ---------- Calculateur de runes ----------
  var el = {
    base: document.getElementById('base'),
    pa: document.getElementById('pa'),
    ra: document.getElementById('ra'),
    mode: document.getElementById('raMode'),
    winner: document.getElementById('winner'),
    net: document.getElementById('winnerNet'),
    detail: document.getElementById('detail')
  };

  function num(input) {
    var v = parseFloat(String(input.value).replace(',', '.'));
    return isFinite(v) ? v : 0;
  }
  function fmt(n) {
    var r = Math.round(n * 10) / 10; // 1 décimale max
    return r.toLocaleString('fr-FR') + ' K';
  }

  function compute() {
    var base = num(el.base), pa = num(el.pa), ra = num(el.ra);
    var coutPA = 3 * base;
    var coutRA = el.mode.value === 'pa' ? 3 * pa : 9 * base;

    var netPA = pa * (1 - TAX) - coutPA;
    var netRA = ra * (1 - TAX) - coutRA;

    var best = netPA >= netRA ? { n: 'PA', v: netPA } : { n: 'RA', v: netRA };
    el.winner.textContent = best.n;
    el.net.textContent = fmt(best.v);
    el.net.className = 'v ' + (best.v >= 0 ? 'pos' : 'neg');

    el.detail.innerHTML =
      row('PA', coutPA, pa * (1 - TAX), netPA) +
      row('RA', coutRA, ra * (1 - TAX), netRA);

    try {
      localStorage.setItem('ku_runes', JSON.stringify({
        base: el.base.value, pa: el.pa.value, ra: el.ra.value, mode: el.mode.value
      }));
    } catch (e) {}
  }
  function row(name, cout, vente, net) {
    return '<tr><td>' + name + '</td><td>' + fmt(cout) + '</td><td>' + fmt(vente) +
      '</td><td class="' + (net >= 0 ? 'pos' : 'neg') + '">' + fmt(net) + '</td></tr>';
  }

  // Restaure les dernières valeurs saisies (propres à chaque navigateur)
  try {
    var saved = JSON.parse(localStorage.getItem('ku_runes') || 'null');
    if (saved) {
      el.base.value = saved.base; el.pa.value = saved.pa;
      el.ra.value = saved.ra; el.mode.value = saved.mode;
    }
    var tab = localStorage.getItem('ku_tab');
    if (tab && document.getElementById(tab)) showTab(tab);
  } catch (e) {}

  [el.base, el.pa, el.ra, el.mode].forEach(function (i) {
    i.addEventListener('input', compute);
    i.addEventListener('change', compute);
  });
  compute();
</script>
</body>
</html>
